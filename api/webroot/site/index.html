<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Konta – native Finanzplanung für iPhone, iPad und Mac.">
  <link rel="icon" href="/site/icon.png" type="image/png">
  <title>Konta – Bald verfügbar</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: #f7f5fb; color: #17131f; }
    main { width: min(34rem, 100%); }
    .mark { width: 4.5rem; height: 4.5rem; display: block; border-radius: 1.15rem; }
    h1 { margin: 2rem 0 1rem; font-size: clamp(2.8rem, 9vw, 5.6rem); line-height: .95; letter-spacing: -.055em; }
    p { max-width: 28rem; margin: 0; color: #686171; font-size: 1.05rem; line-height: 1.55; }
    footer { margin-top: 4rem; color: #8c8495; font-size: .8rem; }
    @media (prefers-color-scheme: dark) { body { background: #100d15; color: #f7f2ff; } p { color: #aaa2b5; } }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/site/icon.png" alt="Konta">
    <h1>Dein Geld.<br>Ein guter Plan.</h1>
    <p>Konta kommt bald auf iPhone, iPad und Mac.</p>
    <footer>© 2026 GROON GmbH</footer>
  </main>
</body>
</html>
