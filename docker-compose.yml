# Haushalts-Finanzplanung – full stack.
# Everything is reachable through nginx on ${SCHEME}://${DOMAIN}:${PORT}.
name: ${COMPOSE_PROJECT_NAME:-finplan}

x-backend-env: &backend-env
  DEBUG: ${DEBUG:-1}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-secret}
  SECURITY_SALT: ${SECURITY_SALT:-insecure-dev-salt}
  AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
  PASSWORD_LINK_TTL_HOURS: ${PASSWORD_LINK_TTL_HOURS:-24}
  DOMAIN: ${DOMAIN:-localhost}
  SCHEME: ${SCHEME:-http}
  PORT: ${PORT:-8080}
  EXTRA_ALLOWED_HOSTS: ${EXTRA_ALLOWED_HOSTS:-}
  POSTGRES_DB: ${POSTGRES_DB:-finplan}
  POSTGRES_USER: ${POSTGRES_USER:-finplan}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finplan_dev_password}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finplan}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finplan_dev_password}
  MINIO_BUCKET: ${MINIO_BUCKET:-finplan-files}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_BATCH_SIZE: ${OPENAI_BATCH_SIZE:-25}
  PREDICTION_HORIZON_MONTHS: ${PREDICTION_HORIZON_MONTHS:-24}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
  TIME_ZONE: ${TIME_ZONE:-Europe/Berlin}
  LANGUAGE_CODE: ${LANGUAGE_CODE:-de-de}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-finanzplanung@localhost}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finplan}
      POSTGRES_USER: ${POSTGRES_USER:-finplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finplan_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finplan} -d ${POSTGRES_DB:-finplan}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finplan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finplan_dev_password}
    # No host ports on purpose: the S3 API is reachable through nginx at /s3/,
    # so the stack only ever occupies ${PORT} on the host. To reach the MinIO
    # console during debugging, publish it temporarily:
    #   docker compose run --rm --service-ports minio
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local ${MINIO_ENDPOINT:-http://minio:9000} ${MINIO_ROOT_USER:-finplan} ${MINIO_ROOT_PASSWORD:-finplan_dev_password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-finplan-files} &&
      echo 'minio bucket ready'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["asgi"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["worker"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["beat"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Finanzplanung}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_data:/srv/static:ro
    environment:
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_data:
